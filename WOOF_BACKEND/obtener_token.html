<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WOOF — Obtener Token de Prueba</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; }
    input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; font-size: 14px; }
    button { background: #ff6b35; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; }
    button:hover { background: #e55a25; }
    #resultado { margin-top: 20px; }
    #token { word-break: break-all; background: #f4f4f4; padding: 12px; font-size: 11px; border-radius: 4px; }
    .error { color: red; }
    .ok { color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h2>🐾 WOOF — Token de prueba</h2>
  <p>Inicia sesión con un usuario de Firebase para obtener el token.</p>

  <label>Email</label>
  <input type="email" id="email" placeholder="usuario@email.com" />

  <label>Contraseña</label>
  <input type="password" id="password" placeholder="contraseña" />

  <button onclick="obtenerToken()">Obtener Token</button>

  <div id="resultado"></div>

  <script>
    const API_KEY = "AIzaSyDzXuDuMKoLnl9c79yBtKk9QU1S6rLLrw0";

    async function obtenerToken() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const resultado = document.getElementById("resultado");

      if (!email || !password) {
        resultado.innerHTML = '<p class="error">Completa email y contraseña.</p>';
        return;
      }

      resultado.innerHTML = "<p>Iniciando sesión...</p>";

      try {
        const res = await fetch(
          `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password, returnSecureToken: true }),
          }
        );

        const data = await res.json();

        if (!res.ok) {
          resultado.innerHTML = `<p class="error">Error: ${data.error?.message || "Credenciales incorrectas"}</p>`;
          return;
        }

        resultado.innerHTML = `
          <p class="ok">✅ Token obtenido. Cópialo y úsalo en /docs</p>
          <p><strong>Cómo usarlo:</strong> En /docs → Authorize → pega el token directamente (sin "Bearer").</p>
          <div id="token">${data.idToken}</div>
          <br>
          <button onclick="copiar()">📋 Copiar token</button>
        `;
      } catch (e) {
        resultado.innerHTML = `<p class="error">Error de red: ${e.message}</p>`;
      }
    }

    function copiar() {
      const token = document.getElementById("token").innerText;
      navigator.clipboard.writeText(token);
      alert("Token copiado (sin 'Bearer').");
    }
  </script>
</body>
</html>
