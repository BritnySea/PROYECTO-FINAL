<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Refugio WOOF</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0A0A0A;
      --surface:#131313;
      --border: rgba(255,255,255,0.08);
      --gold:   #D4AF37;
      --gold-glow: rgba(212,175,55,0.15);
      --white:  rgba(255,255,255,0.92);
      --muted:  rgba(255,255,255,0.45);
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 0 60px var(--gold-glow);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: block;
    }

    .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 32px;
    }

    .code {
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      color: var(--gold);
      letter-spacing: -4px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 10px;
    }

    .desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .url-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
      margin-bottom: 32px;
      text-align: left;
    }

    .url-box span {
      color: rgba(255,68,68,0.85);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gold);
      color: #0A0A0A;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-back:hover { opacity: 0.85; }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="img/logo_refugio.png" alt="Refugio WOOF" />
    <p class="brand">Refugio WOOF</p>

    <p class="code">404</p>
    <p class="title">Página no encontrada</p>
    <p class="desc">
      La dirección que ingresaste no existe o fue escrita incorrectamente.
      Verifica la URL e intenta nuevamente.
    </p>

    <div class="url-box">
      URL incorrecta: <span id="bad-url"></span>
    </div>

    <button class="btn-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Volver al inicio
    </button>
  </div>

  <p class="footer">Refugio WOOF — Panel Administrativo</p>

  <script type="module">
    document.getElementById('bad-url').textContent = window.location.href

    import { initializeApp }  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'
    import { getAuth, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'

    const app  = initializeApp({
      apiKey:            "AIzaSyBPB4oF3u2P5EXdH3JE9iDmA3563jjpYNo",
      authDomain:        "proyectov1-15.firebaseapp.com",
      projectId:         "proyectov1-15",
      storageBucket:     "proyectov1-15.firebasestorage.app",
      messagingSenderId: "939257384265",
      appId:             "1:939257384265:web:e4ae9b913fbaf474101e98",
    })
    const auth = getAuth(app)

    document.querySelector('.btn-back').addEventListener('click', async (e) => {
      e.preventDefault()
      try { await signOut(auth) } catch {}
      localStorage.removeItem('woofActiveTab')
      sessionStorage.removeItem('woofLogoutReason')
      window.location.href = '/index.html'
    })
  </script>
</body>
</html>
