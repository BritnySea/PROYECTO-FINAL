<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Panel Administrativo WOOF</title>
  <link rel="icon" type="image/png" href="img/logo_refugio.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

  <!-- ══════════════ HEADER ══════════════ -->
  <header class="dash-header">

    <div class="dash-brand">
      <img src="img/logo_refugio.png" alt="Logo"
        onerror="this.style.display='none'" />
      <div>
        <p class="dash-brand-sub">Panel Administrativo</p>
        <p class="dash-brand-name">Refugio WOOF</p>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:16px;">
      <span id="admin-name" style="font-size:13px; color:rgba(255,255,255,0.45);"></span>
      <button class="btn-logout" id="btn-logout" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </div>

  </header>

  <!-- ══════════════ CONTENIDO PRINCIPAL ══════════════ -->
  <main class="dash-main">
    <span class="emoji">🐾</span>
    <h2>Bienvenido al panel administrativo</h2>
    <p>El contenido del dashboard se construirá aquí.</p>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
